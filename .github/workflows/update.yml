name: Update Helium

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Get latest version
        id: version
        run: |
          VERSION=$(curl -sL -o /dev/null -w "%{url_effective}" \
            https://github.com/imputnet/helium-linux/releases/latest | sed 's|.*/tag/||')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get sha256
        id: sha256
        run: |
          URL="https://github.com/imputnet/helium-linux/releases/download/${{ steps.version.outputs.version }}/helium-bin_${{ steps.version.outputs.version }}-1_amd64.deb"
          SHA256=$(nix-prefetch-url "$URL")
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Update package
        run: |
          sed -i "s/version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" pkgs/helium.nix
          sed -i "s/sha256 = \".*\"/sha256 = \"${{ steps.sha256.outputs.sha256 }}\"/" pkgs/helium.nix

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "update to ${{ steps.version.outputs.version }}"
          git push
